name: CI/CD - AI Butler (PRODUCCIÓN)

on:
  push:
    branches: [produccion]
  pull_request:
    branches: [produccion]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ai-butler
          POSTGRES_PASSWORD: 01234
          POSTGRES_DB: butler_test   # la intentará crear; abajo la forzamos por si acaso
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h localhost -U ai-butler"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Vars para la app en CI (no usa tu .env local)
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_CI }}   # o dummy si no llamas a OpenAI en tests
      SECRET_KEY: supersecretkey_for_tests
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      POSTGRES_USER: ai-butler
      POSTGRES_PASSWORD: 01234
      POSTGRES_DB: butler_test
      # ⚠️ Host = localhost (porque el job NO corre en contenedor)
      DATABASE_URL: postgresql://ai-butler:01234@localhost:5432/butler_test
      TESTING: "1"
      PGPASSWORD: 01234

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies & psql client
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Wait for Postgres on localhost
      run: |
        for i in {1..30}; do
          if pg_isready -h 127.0.0.1 -U ai-butler; then
            echo "Postgres está listo"
            break
          fi
          echo "Esperando a Postgres..."
          sleep 2
        done

    - name: Create database if missing (connect to 'postgres' DB)
      run: |
        psql -h 127.0.0.1 -U ai-butler -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'butler_test';" | grep -q 1 \
          || psql -h 127.0.0.1 -U ai-butler -d postgres -c "CREATE DATABASE butler_test;"

    - name: Add project root to PYTHONPATH
      run: echo "PYTHONPATH=$(pwd)" >> $GITHUB_ENV

    - name: Run tests
      run: pytest tests/ --maxfail=1 --disable-warnings -q
