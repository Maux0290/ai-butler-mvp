name: CI/CD - AI Butler (DEV & PRODUCCIÓN)

on:
  push:
    branches: [produccion, dev]
  pull_request:
    branches: [produccion, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: butler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d butler_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/butler_test
      SECRET_KEY: supersecretkey_for_tests
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      OPENAI_API_KEY: test_key
      ALGORITHM: HS256

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          for i in {1..10}; do
            if pg_isready -h localhost -U postgres -d butler_test; then
              echo "✅ Postgres está listo"
              break
            fi
            echo "⏳ Esperando a Postgres..."
            sleep 2
          done

      - name: Run Alembic migrations
        run: |
          alembic upgrade head

      - name: Run tests
        run: |
          pytest tests/ --maxfail=1 --disable-warnings -q


