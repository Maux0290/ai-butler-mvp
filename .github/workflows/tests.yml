name: CI Tests

on:
  push:
    branches:
      - produccion
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ai-butler
          POSTGRES_PASSWORD: ai-butler-pass
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ai-butler -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        volumes:
          - ./data/init:/docker-entrypoint-initdb.d

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for DB
        run: |
          until pg_isready -h localhost -p 5432 -U ai-butler; do
            sleep 2
          done

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v

