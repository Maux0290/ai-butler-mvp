version: "3.9"

services:
  # --------- SERVICIO PRINCIPAL: AI Butler (FastAPI) ---------
  ai-butler:
    image: ghcr.io/maux0290/ai-butler-produccion:latest
    container_name: ai-butler
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./logs:/app/logs
      - ./data/static:/app/static
    networks:
      - ai-butler-net

  # --------- BASE DE DATOS: PostgreSQL ---------
  db:
    image: postgres:16-alpine
    container_name: ai-butler-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/init:/docker-entrypoint-initdb.d    # 👈 nueva ruta para init.sql
    networks:
      - ai-butler-net

  # --------- SERVICIO DEV: AI Butler con hot-reload ---------
  ai-butler-dev:
    build:
      context: .
      dockerfile: Dockerfile_dev
    container_name: ai-butler-dev
    restart: always
    env_file: .env
    ports:
      - "8001:8000"
    depends_on:
      - db
    volumes:
      - .:/app
    networks:
      - ai-butler-net
    environment:
      - TESTING=1      

  # --------- (Opcional: pgAdmin) ---------
  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - db
  #   networks:
  #     - ai-butler-net

# --------- VOLUMENES PERSISTENTES ---------
volumes:
  postgres_data:

# --------- RED PRIVADA ---------
networks:
  ai-butler-net:
    driver: bridge

  

